<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Catalogue de la Bibliothèque</title>
  <style>
    body { 
      font-family: Poppins, sans-serif;
      background-color: #f4f6fa;
      margin: 0;
      padding-bottom: 100px;
    }

    header {
      background: black;
      color: white; 
      padding: 15px 30px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .nav-links { display: flex; flex-direction: column; gap: 10px; }

    header a {
      color: white; text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 8px 12px; border-radius: 8px;
      transition: 0.3s; display: flex; align-items: center; gap: 5px;
    }
    header a:hover { background: white; color: #5563DE; }

    .right-header { display: flex; flex-direction: column; gap: 10px; }

    #Rechercher {
      padding: 10px 15px; border-radius: 4px;
      width: 300px; font-size: 16px;
    }

    .container {
      display: flex; flex-wrap: wrap;
      gap: 20px; padding: 20px; justify-content: center;
    }

    .card {
      background: white; border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 250px; padding: 15px;
      transition: 0.3s;
    }
    .card:hover { transform: scale(1.03); }

    button {
      background: crimson; color: white;
      border: none; padding: 8px 12px;
      border-radius: 5px; cursor: pointer;
    }

    .label { color: red; font-weight: bold; }

    .plus-cher {
      text-align: center; font-weight: bold;
      background: #ffeeba; padding: 10px;
      border-radius: 8px; margin: 10px auto;
      width: fit-content;
    }

    footer {
      background: #222; color: white;
      text-align: center; padding: 20px;
      position: fixed; bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-links">
      <a href="safha.html">🏠 Accueil</a>
      <a href="ajoute.html">➕ Ajouter un livre</a>
    </div>

    <div class="right-header">
      <h2>📚 Catalogue</h2>
      <input type="text" id="Rechercher" placeholder="Rechercher un titre...">
      <button id="trier">Trier A-Z / Z-A</button>
    </div>
  </header>

  <div class="container" id="listeLivres"></div>
  <div class="plus-cher" id="plusCher"></div>

  <footer><p id="stats"></p></footer>

  <script>
    let bibliotheque = JSON.parse(localStorage.getItem("bibliotheque")) || [
      { code:12, titre:"Clean Code", auteur:"Robert C. Martin", annee:2008, disponible:true, prix:150 },
      { code:45, titre:"Eloquent JavaScript", auteur:"Marijn Haverbeke", annee:2018, disponible:true, prix:200 },
      { code:33, titre:"You Don’t Know JS", auteur:"Kyle Simpson", annee:2015, disponible:false, prix:180 }
    ];

    let ordreCroissant = true;

    function afficherLivres(filtre = "") {
      const container = document.getElementById("listeLivres");
      container.innerHTML = "";

      const livresFiltres = bibliotheque.filter(livre =>
        livre.titre.toLowerCase().includes(filtre.toLowerCase())
      );

      livresFiltres.forEach(livre => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <h3>${livre.titre}</h3>
          <p><b>Auteur:</b> ${livre.auteur}</p>
          <p><b>Année:</b> ${livre.annee}</p>
          <p><b>Prix:</b> ${livre.prix} DH</p>
          <p><b>Status:</b> ${livre.disponible ? "non réservé" : "réservé"}</p>
          <p><b>Disponible:</b> ${livre.disponible ? "Oui ✅" : "Non ❌"}</p>

          ${livre.disponible 
            ? `<button onclick="reserverLivre(${livre.code})">Réserver</button>` 
            : `<span class="label">Réservé</span>`}

          <button onclick="supprimerLivre(${livre.code})">Supprimer</button>
        `;

        container.appendChild(card);
      });

      afficherStats();
      afficherPlusCher();
    }

    function supprimerLivre(code) {
      bibliotheque = bibliotheque.filter(l => l.code !== code);
      localStorage.setItem("bibliotheque", JSON.stringify(bibliotheque));
      afficherLivres(document.getElementById("Rechercher").value);
    }

    function reserverLivre(code) {
      const livre = bibliotheque.find(l => l.code === code);
      if (livre && livre.disponible) {
        livre.disponible = false;
        alert(`Le livre "${livre.titre}" a été réservé ✅`);
        localStorage.setItem("bibliotheque", JSON.stringify(bibliotheque));
        afficherLivres(document.getElementById("Rechercher").value);
      }
    }

    function afficherStats() {
      const total = bibliotheque.length;
      const dispo = bibliotheque.filter(l => l.disponible).length;
      document.getElementById("stats").textContent = `Total: ${total} | Disponibles: ${dispo}`;
    }

    function afficherPlusCher() {
      if (bibliotheque.length === 0) return;
      const plusCher = bibliotheque.reduce((max, livre) => livre.prix > max.prix ? livre : max);
      document.getElementById("plusCher").innerHTML = `💸 Livre le plus cher: <b>${plusCher.titre}</b> (${plusCher.prix} DH)`;
    }

    document.getElementById("trier").addEventListener("click", () => {
      bibliotheque.sort((a, b) => a.titre.localeCompare(b.titre));
      if (!ordreCroissant) bibliotheque.reverse();
      ordreCroissant = !ordreCroissant;
      afficherLivres(document.getElementById("Rechercher").value);
    });

    document.getElementById("Rechercher").addEventListener("input", (e) => {
      afficherLivres(e.target.value);
    });

    afficherLivres();
  </script>
</body>
</html>
